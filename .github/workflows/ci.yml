name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --frozen
          npm ci --ignore-scripts
      - name: Prepare public tokenizer
        run: uv run python -m app.cli prepare-tokenizer
      - name: Python tests
        run: uv run python -m pytest -q
      - name: Lint
        run: uv run ruff check app infra scripts tests
      - name: Frontend tests
        run: npm run ui:test
      - name: Synthesize infrastructure without deployment
        run: npm run infra:synth
